[project]
name = "dev-null-tty"
version = "0.4.0"
description = "A terminal interface for /dev/null"
readme = "README.md"
authors = [
    { name = "Avetis Avo Pisikyan", email = "apisikya@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11.0.0",
    "textual>=8.2.8",
    "textual-image[textual]>=0.6.6",
]

[project.scripts]
dev-null-tty = "dev_null_tty:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
